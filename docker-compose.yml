services:
  mongo:
    image: mongo:7
    container_name: gm-vocab-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: gm-vocab-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/gm-vocabulary
      JWT_SECRET: JWT_SECRET
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: >
      sh -lc "npm ci && npm run start:dev"

  frontend:
    image: node:24-alpine
    container_name: gm-vocab-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
      NG_CLI_ANALYTICS: "false"
    ports:
      - "4200:4200"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -lc "npm ci && npm run start"

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
