<div
  class="flex w-full items-start gap-3 rounded-xl border p-4 shadow-lg"
  [class]="containerClasses()"
  [attr.role]="data.type === 'error' ? 'alert' : 'status'"
  [attr.aria-live]="data.type === 'error' ? 'assertive' : 'polite'"
>
  <div
    class="flex size-8 shrink-0 items-center justify-center rounded-full text-lg font-bold"
    [class]="iconClasses()"
    aria-hidden="true"
  >
    @switch (data.type) {
      @case ('success') {
        ✓
      }
      @case ('error') {
        ×
      }
      @case ('warning') {
        !
      }
      @case ('info') {
        i
      }
    }
  </div>

  <div class="min-w-0 flex-1">
    @if (messages.length === 1) {
      <p class="mt-1 text-sm">{{ messages[0] }}</p>
    } @else if (messages.length > 1) {
      <ul class="mt-1 list-disc space-y-1 pl-5 text-sm">
        @for (message of messages; track $index) {
          <li>{{ message }}</li>
        }
      </ul>
    }
  </div>

  <button
    type="button"
    class="-m-1 rounded-md p-1 text-current opacity-60 transition hover:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-2"
    aria-label="Close notification"
    (click)="dismiss()"
  >
    <span aria-hidden="true">×</span>
  </button>
</div>
