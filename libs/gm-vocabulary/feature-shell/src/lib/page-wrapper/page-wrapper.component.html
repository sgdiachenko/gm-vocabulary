<gm-data-loading-wrapper class="flex flex-col" [loadingState]="authLoadingState()">
  <mat-toolbar class="flex justify-between shrink-0">
    <span routerLink="/">GM Vocabulary</span>
    <div class="flex items-center gap-2">
      <button
        matButton
        routerLink="/words"
        [class.text-active]="isWordsPageActive()"
        [class.pointer-events-none]="isWordsPageActive()"
      >
        My Words
      </button>

      <button
        matButton
        routerLink="/collections"
        routerLinkActive="text-active pointer-events-none"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Library
      </button>

      @if (username()) {
        <span class="max-w-40 truncate" [title]="username()">{{ username() }}</span>
      }
      <button matButton (click)="logout()">Logout</button>
    </div>
  </mat-toolbar>

  <div class="grow min-h-0">
    <router-outlet />
  </div>
</gm-data-loading-wrapper>
