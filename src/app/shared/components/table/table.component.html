<table mat-table [dataSource]="dataSource()">
  <ng-container matColumnDef="select" sticky="true">
    <th mat-header-cell *matHeaderCellDef class="mat-mdc-cell_checkbox">
      <gm-checkbox
        (checkedChange)="toggleAllRows()"
        [checked]="selection.hasValue() && isAllSelected()"
        [indeterminate]="selection.hasValue() && !isAllSelected()"
        [disabled]="!allowEdit()"
      ></gm-checkbox>
    </th>

    <td mat-cell *matCellDef="let row" class="mat-mdc-cell_checkbox">
      <gm-checkbox
        (click)="$event.stopPropagation()"
        (checkedChange)="toggleRow(row)"
        [checked]="selection.isSelected(row)"
        [disabled]="!allowEdit()"
      ></gm-checkbox>
    </td>
  </ng-container>

  @for (column of columns(); track $index) {
    <ng-container matColumnDef="{{column.name}}">
      <th mat-header-cell *matHeaderCellDef sticky="true">{{column.displayName}}</th>
      <td mat-cell *matCellDef="let element" [style.min-width.px]="column.minWidth">
        {{element[column.name]}}
      </td>
    </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="columnsNames; sticky: true"></tr>
  <tr
    mat-row *matRowDef="let row; columns: columnsNames;"
    (click)="allowEdit() ? toggleRow(row) : null"
  ></tr>
</table>
